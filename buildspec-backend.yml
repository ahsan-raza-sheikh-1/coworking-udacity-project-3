version: 0.2

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE="${REGISTRY}/backend:${IMAGE_TAG}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
  build:
    commands:
      - test -f "${CODEBUILD_SRC_DIR}/starter/backend/Dockerfile"
      - docker build --tag "${IMAGE}" "${CODEBUILD_SRC_DIR}/starter/backend"
      - docker push "${IMAGE}"
  post_build:
    commands:
      - printf '{"image":"%s"}\n' "${IMAGE}" > backend-image.json

artifacts:
  files:
    - backend-image.json